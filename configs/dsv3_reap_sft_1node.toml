# DSv3 REAP-345B: Single-node 8-GPU SFT test config
#
# EP=8, DP=1 on one B200 node (8 GPUs)
# Uses ECO optimizer (NVFP4 primary + FP8 states)
#
# Usage:
#   torchrun --nproc_per_node=8 -m nmoe.train configs/dsv3_reap_sft_1node.toml

preset = "dsv3_reap"
experiment_id = "dsv3_reap_sft_1node_test"

# =============================================================================
# Model Architecture (REAP-345B / DeepSeek V3.2)
# =============================================================================
vocab_size = 129280
eos_token_id = 1         # DeepSeek V3.2: <｜end▁of▁sentence｜> = token 1
dim = 7168
inter_dim = 18432
moe_inter_dim = 2048
n_layers = 61
n_dense_layers = 3
n_heads = 128
n_routed_experts = 128
n_shared_experts = 1
n_activated_experts = 8
route_scale = 2.5

# MLA
q_lora_rank = 1536
kv_lora_rank = 512
qk_nope_head_dim = 128
qk_rope_head_dim = 64
v_head_dim = 128

# RoPE
max_position_embeddings = 163840
rope_theta = 10000.0
rms_norm_eps = 1e-6

# =============================================================================
# Parallelism: EP=8, DP=1 (single node)
# =============================================================================
ep_size = 8
dp_size = 1

# =============================================================================
# Data (synthetic for testing -- will be overridden by SFT loader)
# =============================================================================
data_path = "/tmp/nmoe_test_data"

# =============================================================================
# Optimizer
# =============================================================================
lr_dense = 1e-5
lr_router = 1e-5
lr_expert = 1e-5
decay_floor = 1e-6                  # Must be <= min(lr_dense, lr_expert); default 3e-5 is too high
weight_decay = 0.01
adam_beta1 = 0.9
adam_beta2 = 0.98
adam_eps = 1e-9

# =============================================================================
# ECO Optimizer (Fused Backward-Optimizer: applies ECO inside backward pass)
# =============================================================================
eco_enabled = false
eco_fused_backward = true
eco_error_feedback = true
eco_stochastic_rounding = true
gradient_checkpointing = true

# =============================================================================
# Training
# =============================================================================
steps = 10
dtype = "nvfp4"
batch_size = 8
seq_len = 512
resume = true
grad_clip = 1.0

# =============================================================================
# Checkpointing
# =============================================================================
checkpoint_dir = "/home/nourdine/nmoe_checkpoints/reap345b_nvfp4"
checkpoint_every = 5

# =============================================================================
# Experiments & Metrics
# =============================================================================
experiments_db = "/home/nourdine/nmoe/experiments.db"
metrics_dir = "/home/nourdine/nmoe/metrics"

# =============================================================================
# SFT
# =============================================================================
sft_enabled = true
sft_data_path = "/tmp/nmoe_sft_test"
sft_mask_prompt_loss = true
sft_prompt_format = "deepseekv32"
