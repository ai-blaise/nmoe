name: Multi-GPU Tests

on:
  push:
    branches: [main]
    paths:
      - 'nmoe/**/*.py'
      - 'nmoe/**/*.cu'
      - 'nmoe/**/*.cpp'
      - 'tests/**/*.py'
  pull_request:
    branches: [main]
    paths:
      - 'nmoe/**/*.py'
      - 'nmoe/**/*.cu'
      - 'nmoe/**/*.cpp'
      - 'tests/**/*.py'
  schedule:
    # Run weekly on Sunday at 4 AM UTC
    - cron: '0 4 * * 0'
  workflow_dispatch:
    inputs:
      gpu_count:
        description: 'Number of GPUs to use'
        required: false
        default: '8'
        type: choice
        options:
          - '2'
          - '4'
          - '8'
      run_nvshmem:
        description: 'Run NVSHMEM tests (requires multi-node setup)'
        required: false
        default: false
        type: boolean

concurrency:
  group: multi-gpu-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  multi-gpu-2:
    name: Multi-GPU Tests (2 GPUs)
    runs-on: self-hosted
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python environment
        run: |
          python3.12 -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip

      - name: Install dependencies
        run: |
          source .venv/bin/activate
          pip install torch numpy pytest safetensors

      - name: Install nmoe
        run: |
          source .venv/bin/activate
          pip install -e .

      - name: Check GPU availability
        run: |
          source .venv/bin/activate
          python << 'EOF'
          import torch
          gpu_count = torch.cuda.device_count()
          print(f"Available GPUs: {gpu_count}")
          for i in range(gpu_count):
              props = torch.cuda.get_device_properties(i)
              print(f"  GPU {i}: {props.name} ({props.total_memory / 1e9:.1f} GB)")
          if gpu_count < 2:
              raise SystemExit("At least 2 GPUs required")
          EOF

      - name: Run EP=2 tests
        run: |
          source .venv/bin/activate
          torchrun --nproc_per_node=2 \
            -m pytest tests/test_ep_tp.py -v -m "distributed" \
            --tb=short \
            -k "ep2 or two_gpu" || true

      - name: Run RDEP IPC tests (2 GPU)
        run: |
          source .venv/bin/activate
          torchrun --nproc_per_node=2 \
            -m pytest tests/test_rdep.py -v -m "distributed" \
            --tb=short || true

  multi-gpu-4:
    name: Multi-GPU Tests (4 GPUs)
    runs-on: self-hosted
    timeout-minutes: 30
    if: github.event_name == 'schedule' || github.event.inputs.gpu_count == '4' || github.event.inputs.gpu_count == '8'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python environment
        run: |
          python3.12 -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip

      - name: Install dependencies
        run: |
          source .venv/bin/activate
          pip install torch numpy pytest safetensors

      - name: Install nmoe
        run: |
          source .venv/bin/activate
          pip install -e .

      - name: Check GPU availability
        run: |
          source .venv/bin/activate
          python << 'EOF'
          import torch
          gpu_count = torch.cuda.device_count()
          if gpu_count < 4:
              raise SystemExit("At least 4 GPUs required")
          print(f"Available GPUs: {gpu_count}")
          EOF

      - name: Run EP=4 tests
        run: |
          source .venv/bin/activate
          torchrun --nproc_per_node=4 \
            -m pytest tests/test_ep_tp.py -v -m "distributed" \
            --tb=short \
            -k "ep4" || true

      - name: Run EP=2, TP=2 tests
        run: |
          source .venv/bin/activate
          torchrun --nproc_per_node=4 \
            -m pytest tests/test_ep_tp.py -v -m "distributed" \
            --tb=short \
            -k "ep2_tp2" || true

  multi-gpu-8:
    name: Multi-GPU Tests (8 GPUs)
    runs-on: self-hosted
    timeout-minutes: 45
    if: github.event_name == 'schedule' || github.event.inputs.gpu_count == '8'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python environment
        run: |
          python3.12 -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip

      - name: Install dependencies
        run: |
          source .venv/bin/activate
          pip install torch numpy pytest safetensors

      - name: Install nmoe
        run: |
          source .venv/bin/activate
          pip install -e .

      - name: Check GPU availability
        run: |
          source .venv/bin/activate
          python << 'EOF'
          import torch
          gpu_count = torch.cuda.device_count()
          if gpu_count < 8:
              raise SystemExit("8 GPUs required")
          print(f"Available GPUs: {gpu_count}")
          EOF

      - name: Run EP=8 tests
        run: |
          source .venv/bin/activate
          torchrun --nproc_per_node=8 \
            -m pytest tests/test_ep_tp.py -v -m "distributed" \
            --tb=short \
            -k "ep8" || true

      - name: Run EP=4, TP=2 tests
        run: |
          source .venv/bin/activate
          torchrun --nproc_per_node=8 \
            -m pytest tests/test_ep_tp.py -v -m "distributed" \
            --tb=short \
            -k "ep4_tp2" || true

      - name: Run full EP+TP matrix
        run: |
          source .venv/bin/activate
          python << 'PYEOF'
          import subprocess
          import sys

          # Test configurations: (ep_size, tp_size)
          configs = [
              (8, 1),
              (4, 2),
              (2, 4),
              (1, 8),
          ]

          failed = []
          for ep, tp in configs:
              print(f"\n{'='*60}")
              print(f"Testing EP={ep}, TP={tp}")
              print(f"{'='*60}\n")

              result = subprocess.run([
                  "torchrun",
                  "--nproc_per_node=8",
                  "-m", "pytest",
                  "tests/test_rdep.py",
                  "-v", "-m", "distributed",
                  "--tb=short",
                  "-k", f"ep{ep}_tp{tp}",
              ], capture_output=False)

              if result.returncode != 0:
                  failed.append((ep, tp))

          if failed:
              print(f"\nFailed configurations: {failed}")
              # Don't fail the job, just report
          else:
              print("\nAll configurations passed!")
          PYEOF

  nvshmem-tests:
    name: NVSHMEM Tests
    runs-on: self-hosted
    timeout-minutes: 30
    if: github.event.inputs.run_nvshmem == 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python environment
        run: |
          python3.12 -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip

      - name: Install dependencies
        run: |
          source .venv/bin/activate
          pip install torch numpy pytest safetensors

      - name: Install nmoe
        run: |
          source .venv/bin/activate
          pip install -e .

      - name: Check NVSHMEM availability
        run: |
          source .venv/bin/activate
          python << 'EOF'
          try:
              from nmoe.csrc import rdep as _C
              if not _C.has_nvshmem():
                  raise SystemExit("NVSHMEM not available in build")
              print("NVSHMEM is available")
          except ImportError as e:
              raise SystemExit(f"Failed to import rdep: {e}")
          EOF

      - name: Run NVSHMEM tests
        run: |
          source .venv/bin/activate
          pytest tests/ -v -m "nvshmem" --tb=short

  summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [multi-gpu-2]
    if: always()

    steps:
      - name: Generate summary
        run: |
          echo "## Multi-GPU Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Multi-GPU (2) | ${{ needs.multi-gpu-2.result }} |" >> $GITHUB_STEP_SUMMARY

          # Check overall status
          if [ "${{ needs.multi-gpu-2.result }}" == "success" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Multi-GPU tests completed successfully." >> $GITHUB_STEP_SUMMARY
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Some multi-GPU tests failed. Check individual job logs." >> $GITHUB_STEP_SUMMARY
          fi
