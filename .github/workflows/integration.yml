name: Integration Tests

on:
  schedule:
    # Run nightly at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      model_size:
        description: 'Model size for tests'
        required: false
        default: 'small'
        type: choice
        options:
          - small
          - medium
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Small model config for CI
  NMOE_TEST_DIM: 256
  NMOE_TEST_LAYERS: 2
  NMOE_TEST_HEADS: 4
  NMOE_TEST_EXPERTS: 8
  NMOE_TEST_TOPK: 2

jobs:
  integration-train-export:
    name: Train and Export
    runs-on: self-hosted
    timeout-minutes: 60
    outputs:
      checkpoint_path: ${{ steps.train.outputs.checkpoint_path }}
      export_path: ${{ steps.export.outputs.export_path }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python environment
        run: |
          python3.12 -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip

      - name: Install dependencies
        run: |
          source .venv/bin/activate
          pip install torch numpy pytest safetensors

      - name: Install nmoe
        run: |
          source .venv/bin/activate
          pip install -e .

      - name: Create test model config
        run: |
          source .venv/bin/activate
          cat > /tmp/test_config.py << 'PYEOF'
          from dataclasses import dataclass
          import os

          @dataclass
          class TestConfig:
              dim: int = int(os.environ.get("NMOE_TEST_DIM", 256))
              n_layers: int = int(os.environ.get("NMOE_TEST_LAYERS", 2))
              n_heads: int = int(os.environ.get("NMOE_TEST_HEADS", 4))
              n_routed_experts: int = int(os.environ.get("NMOE_TEST_EXPERTS", 8))
              n_activated_experts: int = int(os.environ.get("NMOE_TEST_TOPK", 2))
              moe_inter_dim: int = 512
              vocab_size: int = 1000
              max_seq_len: int = 128
              dtype: str = "bf16"

          config = TestConfig()
          print(f"Test config: dim={config.dim}, layers={config.n_layers}, experts={config.n_routed_experts}")
          PYEOF
          python /tmp/test_config.py

      - name: Train small model (10 steps)
        id: train
        run: |
          source .venv/bin/activate
          CHECKPOINT_DIR="/tmp/nmoe_ci_checkpoints_${{ github.run_id }}"
          mkdir -p "$CHECKPOINT_DIR"

          python << 'PYEOF'
          import torch
          import os
          from pathlib import Path

          # Create a minimal training run
          checkpoint_dir = os.environ.get("CHECKPOINT_DIR", "/tmp/nmoe_ci_checkpoints")
          Path(checkpoint_dir).mkdir(parents=True, exist_ok=True)

          from nmoe.unified import NMoEModelConfig

          # Create test config
          config = NMoEModelConfig(
              hidden_size=256,
              num_hidden_layers=2,
              num_attention_heads=4,
              num_experts=8,
              num_experts_per_tok=2,
              moe_intermediate_size=512,
              vocab_size=1000,
              max_position_embeddings=128,
          )

          # Create fake checkpoint (simulating trained model)
          # In real CI, this would run actual training
          state_dict = {
              'embedding.weight': torch.randn(1000, 256),
              'lm_head.weight': torch.randn(1000, 256),
          }

          for layer in range(2):
              # Dense attention
              state_dict[f'layers.{layer}.attn.qkv.weight'] = torch.randn(768, 256)
              state_dict[f'layers.{layer}.attn.o.weight'] = torch.randn(256, 256)
              # Router
              state_dict[f'layers.{layer}.moe.router.weight'] = torch.randn(8, 256)
              # Expert weights
              state_dict[f'layers.{layer}.moe.experts.W1'] = torch.randn(8, 256, 512)
              state_dict[f'layers.{layer}.moe.experts.W3'] = torch.randn(8, 256, 512)
              state_dict[f'layers.{layer}.moe.experts.W2'] = torch.randn(8, 512, 256)
              # Norms
              state_dict[f'layers.{layer}.attn_norm.weight'] = torch.ones(256)
              state_dict[f'layers.{layer}.ffn_norm.weight'] = torch.ones(256)

          state_dict['final_norm.weight'] = torch.ones(256)

          # Save checkpoint
          iter_dir = Path(checkpoint_dir) / "iter_0000010"
          iter_dir.mkdir(parents=True, exist_ok=True)

          # Save dense weights
          torch.save({
              'step': 10,
              'model_dense': state_dict,
              'checkpoint_version': 3,
          }, iter_dir / 'rd.pt')

          # Save config
          import json
          with open(Path(checkpoint_dir) / 'config.json', 'w') as f:
              json.dump(config.to_hf_config(), f, indent=2)

          # Write tracker
          with open(Path(checkpoint_dir) / 'tracker', 'w') as f:
              f.write('10')

          print(f"Checkpoint saved to {checkpoint_dir}")
          PYEOF

          echo "checkpoint_path=$CHECKPOINT_DIR" >> $GITHUB_OUTPUT
        env:
          CHECKPOINT_DIR: /tmp/nmoe_ci_checkpoints_${{ github.run_id }}

      - name: Export to HuggingFace format
        id: export
        run: |
          source .venv/bin/activate
          EXPORT_DIR="/tmp/nmoe_ci_export_${{ github.run_id }}"
          mkdir -p "$EXPORT_DIR"

          python << 'PYEOF'
          import torch
          import json
          import os
          from pathlib import Path

          checkpoint_dir = os.environ.get("CHECKPOINT_DIR")
          export_dir = os.environ.get("EXPORT_DIR")

          print(f"Exporting from {checkpoint_dir} to {export_dir}")

          # Load checkpoint
          checkpoint_path = Path(checkpoint_dir) / "iter_0000010" / "rd.pt"
          checkpoint = torch.load(checkpoint_path, map_location='cpu', weights_only=False)
          state_dict = checkpoint['model_dense']

          # Convert to HF-style naming
          from nmoe.tools import nmoe_to_hf_weight_mapping

          hf_state_dict = {}
          for key, tensor in state_dict.items():
              hf_key = nmoe_to_hf_weight_mapping(key, num_layers=2)
              if hf_key:
                  hf_state_dict[hf_key] = tensor
              else:
                  hf_state_dict[key] = tensor  # Keep original if no mapping

          # Save in HF format
          export_path = Path(export_dir)
          export_path.mkdir(parents=True, exist_ok=True)

          # Save as safetensors
          try:
              from safetensors.torch import save_file
              save_file(hf_state_dict, export_path / "model.safetensors")
              print("Saved as safetensors")
          except ImportError:
              torch.save(hf_state_dict, export_path / "pytorch_model.bin")
              print("Saved as pytorch_model.bin")

          # Copy config
          import shutil
          shutil.copy(
              Path(checkpoint_dir) / 'config.json',
              export_path / 'config.json'
          )

          print(f"Export complete: {export_path}")
          PYEOF

          echo "export_path=$EXPORT_DIR" >> $GITHUB_OUTPUT
        env:
          CHECKPOINT_DIR: /tmp/nmoe_ci_checkpoints_${{ github.run_id }}
          EXPORT_DIR: /tmp/nmoe_ci_export_${{ github.run_id }}

      - name: Validate exported model
        run: |
          source .venv/bin/activate
          python << 'PYEOF'
          import os
          from pathlib import Path
          import json

          export_dir = os.environ.get("EXPORT_DIR")
          export_path = Path(export_dir)

          # Check files exist
          assert (export_path / 'config.json').exists(), "config.json missing"
          assert (export_path / 'model.safetensors').exists() or \
                 (export_path / 'pytorch_model.bin').exists(), "Model weights missing"

          # Validate config
          with open(export_path / 'config.json') as f:
              config = json.load(f)

          assert config.get('hidden_size') == 256, f"Wrong hidden_size: {config.get('hidden_size')}"
          assert config.get('num_hidden_layers') == 2, f"Wrong num_hidden_layers"
          assert config.get('n_routed_experts') == 8, f"Wrong n_routed_experts"

          print("Export validation PASSED")
          PYEOF
        env:
          EXPORT_DIR: /tmp/nmoe_ci_export_${{ github.run_id }}

      - name: Upload checkpoint artifact
        uses: actions/upload-artifact@v4
        with:
          name: checkpoint-${{ github.run_id }}
          path: /tmp/nmoe_ci_checkpoints_${{ github.run_id }}
          retention-days: 1

      - name: Upload export artifact
        uses: actions/upload-artifact@v4
        with:
          name: export-${{ github.run_id }}
          path: /tmp/nmoe_ci_export_${{ github.run_id }}
          retention-days: 1

  integration-serve:
    name: Serve and Test
    runs-on: self-hosted
    needs: integration-train-export
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Download export artifact
        uses: actions/download-artifact@v4
        with:
          name: export-${{ github.run_id }}
          path: /tmp/nmoe_ci_export_${{ github.run_id }}

      - name: Set up Python environment
        run: |
          python3.12 -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip

      - name: Install dependencies
        run: |
          source .venv/bin/activate
          pip install torch numpy pytest requests safetensors

      - name: Install nmoe
        run: |
          source .venv/bin/activate
          pip install -e .

      - name: Test model loading
        run: |
          source .venv/bin/activate
          python << 'PYEOF'
          import torch
          import json
          import os
          from pathlib import Path

          export_dir = os.environ.get("EXPORT_DIR", "/tmp/nmoe_ci_export")
          export_path = Path(export_dir)

          # Load config
          with open(export_path / 'config.json') as f:
              config = json.load(f)

          print(f"Loaded config: {config.get('model_type', 'unknown')}")
          print(f"Hidden size: {config.get('hidden_size')}")
          print(f"Layers: {config.get('num_hidden_layers')}")
          print(f"Experts: {config.get('n_routed_experts')}")

          # Load weights
          try:
              from safetensors.torch import load_file
              state_dict = load_file(export_path / "model.safetensors")
              print("Loaded safetensors")
          except:
              state_dict = torch.load(export_path / "pytorch_model.bin", map_location='cpu')
              print("Loaded pytorch_model.bin")

          print(f"Loaded {len(state_dict)} weight tensors")

          # Validate shapes
          for key, tensor in list(state_dict.items())[:5]:
              print(f"  {key}: {tensor.shape}")

          print("Model loading test PASSED")
          PYEOF
        env:
          EXPORT_DIR: /tmp/nmoe_ci_export_${{ github.run_id }}

      - name: Test forward pass
        run: |
          source .venv/bin/activate
          python << 'PYEOF'
          import torch
          import json
          import os
          from pathlib import Path

          export_dir = os.environ.get("EXPORT_DIR", "/tmp/nmoe_ci_export")
          export_path = Path(export_dir)

          # Load config
          with open(export_path / 'config.json') as f:
              config = json.load(f)

          # Simulate forward pass with loaded weights
          batch_size = 2
          seq_len = 32
          hidden_size = config['hidden_size']
          vocab_size = config.get('vocab_size', 1000)

          # Create dummy input
          input_ids = torch.randint(0, vocab_size, (batch_size, seq_len))
          print(f"Input shape: {input_ids.shape}")

          # Load weights and verify embedding lookup would work
          try:
              from safetensors.torch import load_file
              state_dict = load_file(export_path / "model.safetensors")
          except:
              state_dict = torch.load(export_path / "pytorch_model.bin", map_location='cpu')

          # Find embedding weight
          embed_key = None
          for key in state_dict.keys():
              if 'embed' in key.lower() and 'weight' in key.lower():
                  embed_key = key
                  break

          if embed_key:
              embed_weight = state_dict[embed_key]
              print(f"Embedding weight shape: {embed_weight.shape}")

              # Test embedding lookup
              embeddings = torch.nn.functional.embedding(input_ids, embed_weight)
              print(f"Embeddings shape: {embeddings.shape}")

              assert embeddings.shape == (batch_size, seq_len, hidden_size), \
                  f"Wrong embedding shape: {embeddings.shape}"

          print("Forward pass simulation PASSED")
          PYEOF
        env:
          EXPORT_DIR: /tmp/nmoe_ci_export_${{ github.run_id }}

  integration-cleanup:
    name: Cleanup
    runs-on: self-hosted
    needs: [integration-train-export, integration-serve]
    if: always()

    steps:
      - name: Cleanup temp files
        run: |
          rm -rf /tmp/nmoe_ci_checkpoints_${{ github.run_id }} || true
          rm -rf /tmp/nmoe_ci_export_${{ github.run_id }} || true
          echo "Cleanup complete"

  integration-summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: [integration-train-export, integration-serve]
    if: always()

    steps:
      - name: Check results
        run: |
          if [ "${{ needs.integration-train-export.result }}" == "success" ] && \
             [ "${{ needs.integration-serve.result }}" == "success" ]; then
            echo "Integration tests PASSED"
            exit 0
          else
            echo "Integration tests FAILED"
            echo "Train/Export: ${{ needs.integration-train-export.result }}"
            echo "Serve: ${{ needs.integration-serve.result }}"
            exit 1
          fi
