---
# Secrets template for nmoe deployment
# IMPORTANT: This file contains TEMPLATE placeholders - you MUST replace them before applying
#
# SECURITY BEST PRACTICES:
# 1. NEVER commit actual secrets to version control
# 2. Use External Secrets Operator, Vault, or cloud-native secrets managers in production
# 3. Replace all <PLACEHOLDER> values with real credentials before applying
# 4. Consider using sealed-secrets or SOPS for GitOps workflows

# HuggingFace token for model downloads
apiVersion: v1
kind: Secret
metadata:
  name: nmoe-hf-token
  namespace: nmoe
  labels:
    app: nmoe
    component: credentials
  annotations:
    # Indicate this is a template that needs modification
    nmoe.io/template: "true"
    nmoe.io/instructions: "Replace <HF_TOKEN> with your HuggingFace token from https://huggingface.co/settings/tokens"
type: Opaque
stringData:
  # REQUIRED: Replace with your HuggingFace token
  # Get your token from: https://huggingface.co/settings/tokens
  HF_TOKEN: "<HF_TOKEN>"
---
# API key for SGLang server authentication
apiVersion: v1
kind: Secret
metadata:
  name: nmoe-api-key
  namespace: nmoe
  labels:
    app: nmoe
    component: credentials
  annotations:
    nmoe.io/template: "true"
    nmoe.io/instructions: "Generate with: openssl rand -hex 32"
type: Opaque
stringData:
  # REQUIRED: Generate a secure API key
  # Command: openssl rand -hex 32
  API_KEY: "<API_KEY>"
---
# Weights & Biases for experiment tracking (optional)
apiVersion: v1
kind: Secret
metadata:
  name: nmoe-wandb
  namespace: nmoe
  labels:
    app: nmoe
    component: credentials
  annotations:
    nmoe.io/template: "true"
    nmoe.io/optional: "true"
type: Opaque
stringData:
  # Optional: W&B credentials for experiment tracking
  WANDB_API_KEY: "<WANDB_API_KEY>"
  WANDB_ENTITY: "<WANDB_ENTITY>"
  WANDB_PROJECT: "nmoe-training"
---
# Cloud storage credentials (optional - uncomment provider you use)
apiVersion: v1
kind: Secret
metadata:
  name: nmoe-storage-creds
  namespace: nmoe
  labels:
    app: nmoe
    component: credentials
  annotations:
    nmoe.io/template: "true"
    nmoe.io/optional: "true"
type: Opaque
stringData:
  # AWS S3 (uncomment and fill if using S3)
  # AWS_ACCESS_KEY_ID: "<AWS_ACCESS_KEY_ID>"
  # AWS_SECRET_ACCESS_KEY: "<AWS_SECRET_ACCESS_KEY>"
  AWS_REGION: "us-east-1"
  # GCS: Mount service account JSON file instead
  # Azure: Use AZURE_STORAGE_CONNECTION_STRING
---
# External Secrets Operator example (RECOMMENDED for production)
# Requires External Secrets Operator: https://external-secrets.io/
#
# Uncomment and configure to pull secrets from Vault, AWS Secrets Manager, etc.
#
# apiVersion: external-secrets.io/v1beta1
# kind: ExternalSecret
# metadata:
#   name: nmoe-external-secrets
#   namespace: nmoe
# spec:
#   refreshInterval: 1h
#   secretStoreRef:
#     name: vault-backend  # or aws-secrets-manager, gcp-secrets-manager
#     kind: ClusterSecretStore
#   target:
#     name: nmoe-all-secrets
#     creationPolicy: Owner
#   data:
#     - secretKey: HF_TOKEN
#       remoteRef:
#         key: nmoe/huggingface
#         property: token
#     - secretKey: API_KEY
#       remoteRef:
#         key: nmoe/api
#         property: key
---
# ServiceAccount for nmoe pods
# Note: secrets field removed (deprecated in K8s 1.24+)
# Service accounts now use projected volumes for token mounting
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nmoe-service-account
  namespace: nmoe
  labels:
    app: nmoe
automountServiceAccountToken: false  # Explicit security setting
---
# RBAC for secrets access
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nmoe-secrets-reader
  namespace: nmoe
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - nmoe-hf-token
      - nmoe-api-key
      - nmoe-wandb
      - nmoe-storage-creds
    verbs: ["get", "list"]  # Added list for secret discovery
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nmoe-secrets-binding
  namespace: nmoe
subjects:
  - kind: ServiceAccount
    name: nmoe-service-account
    namespace: nmoe
roleRef:
  kind: Role
  name: nmoe-secrets-reader
  apiGroup: rbac.authorization.k8s.io
