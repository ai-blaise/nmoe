---
# ResourceQuota for nmoe namespace
# Limits total resource consumption for multi-tenant clusters
apiVersion: v1
kind: ResourceQuota
metadata:
  name: nmoe-quota
  namespace: nmoe
spec:
  hard:
    # GPU limits
    requests.nvidia.com/gpu: "32"  # Max 32 GPUs per namespace
    limits.nvidia.com/gpu: "32"

    # CPU limits
    requests.cpu: "256"  # 256 vCPUs total
    limits.cpu: "512"

    # Memory limits
    requests.memory: "2Ti"  # 2TB RAM total
    limits.memory: "4Ti"

    # Pod limits
    pods: "64"  # Max 64 pods (8 nodes x 8 pods)
    services: "16"
    secrets: "32"
    configmaps: "32"
    persistentvolumeclaims: "16"

    # Storage limits
    requests.storage: "2Ti"
---
# LimitRange for default pod limits
apiVersion: v1
kind: LimitRange
metadata:
  name: nmoe-limits
  namespace: nmoe
spec:
  limits:
    # Default limits for containers
    - type: Container
      default:
        cpu: "4"
        memory: "32Gi"
        nvidia.com/gpu: "1"
      defaultRequest:
        cpu: "2"
        memory: "16Gi"
        nvidia.com/gpu: "1"
      max:
        cpu: "64"
        memory: "1Ti"
        nvidia.com/gpu: "8"
      min:
        cpu: "100m"
        memory: "256Mi"

    # Pod-level limits
    - type: Pod
      max:
        cpu: "128"
        memory: "2Ti"
        nvidia.com/gpu: "8"

    # PVC size limits
    - type: PersistentVolumeClaim
      max:
        storage: "1Ti"
      min:
        storage: "1Gi"
---
# Priority class for nmoe workloads
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: nmoe-high-priority
value: 1000000
globalDefault: false
description: "High priority for nmoe training jobs"
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: nmoe-inference-priority
value: 900000
globalDefault: false
description: "Priority for nmoe inference serving"
