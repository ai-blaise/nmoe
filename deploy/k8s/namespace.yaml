# nmoe Namespace with Pod Security Admission labels
apiVersion: v1
kind: Namespace
metadata:
  name: nmoe
  labels:
    # Namespace selector label for NetworkPolicy
    name: nmoe
    # Pod Security Standards - privileged required for GPU workloads
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
    # Application labels
    app.kubernetes.io/name: nmoe
    app.kubernetes.io/part-of: nmoe-platform
