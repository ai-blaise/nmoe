{{- if .Values.secrets.create }}
---
# HuggingFace token secret
{{- if not .Values.secrets.huggingface.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.huggingface.secretName }}
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  labels:
    {{- include "nmoe.labels" . | nindent 4 }}
    component: credentials
type: Opaque
stringData:
  # IMPORTANT: Replace with your actual HuggingFace token
  # Or use --set secrets.huggingface.existingSecret=<name> to reference existing secret
  {{ .Values.secrets.huggingface.key }}: "hf_xxxxxxxxxxxxxxxxxxxxxxxxxxxx"
{{- end }}
---
# API key secret
{{- if not .Values.secrets.apiKey.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.apiKey.secretName }}
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  labels:
    {{- include "nmoe.labels" . | nindent 4 }}
    component: credentials
type: Opaque
stringData:
  # Generate with: openssl rand -hex 32
  {{ .Values.secrets.apiKey.key }}: "your-api-key-here"
{{- end }}
---
# Local-only W&B metadata secret
{{- if and .Values.secrets.wandb.enabled (not .Values.secrets.wandb.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.wandb.secretName }}
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  labels:
    {{- include "nmoe.labels" . | nindent 4 }}
    component: credentials
type: Opaque
stringData:
  WANDB_PROJECT: "nmoe-local"
{{- end }}
{{- end }}
