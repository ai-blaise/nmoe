{{- if and .Values.sglang.enabled .Values.sglang.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "nmoe.sglang.fullname" . }}
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  labels:
    {{- include "nmoe.sglang.labels" . | nindent 4 }}
  {{- with .Values.sglang.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.sglang.ingress.className }}
  ingressClassName: {{ .Values.sglang.ingress.className }}
  {{- end }}
  {{- if .Values.sglang.ingress.tls }}
  tls:
    {{- range .Values.sglang.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.sglang.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "nmoe.sglang.fullname" $ }}
                port:
                  number: {{ $.Values.sglang.service.port }}
          {{- end }}
    {{- end }}
{{- end }}
