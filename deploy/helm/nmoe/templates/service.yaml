{{- if .Values.sglang.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nmoe.sglang.fullname" . }}
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  labels:
    {{- include "nmoe.sglang.labels" . | nindent 4 }}
  {{- with .Values.sglang.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.sglang.service.type }}
  ports:
    - name: http
      port: {{ .Values.sglang.service.port }}
      targetPort: http
      protocol: TCP
    - name: metrics
      port: {{ .Values.monitoring.metrics.port }}
      targetPort: metrics
      protocol: TCP
  selector:
    {{- include "nmoe.sglang.selectorLabels" . | nindent 4 }}
{{- end }}
---
{{- if .Values.skyrl.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nmoe.skyrl.fullname" . }}
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  labels:
    {{- include "nmoe.skyrl.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: ray-head
      port: {{ .Values.skyrl.ray.headServicePort }}
      targetPort: ray-head
      protocol: TCP
    - name: dashboard
      port: {{ .Values.skyrl.ray.dashboardPort }}
      targetPort: dashboard
      protocol: TCP
  selector:
    {{- include "nmoe.skyrl.selectorLabels" . | nindent 4 }}
{{- end }}
---
# Headless service for NCCL/RDMA peer discovery
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nmoe.fullname" . }}-headless
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  labels:
    {{- include "nmoe.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - name: nccl
      port: 29500
      targetPort: 29500
      protocol: TCP
    - name: nvshmem
      port: 12355
      targetPort: 12355
      protocol: TCP
  selector:
    app: nmoe
