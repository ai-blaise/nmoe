{{- if .Values.sglang.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nmoe.sglang.fullname" . }}
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  labels:
    {{- include "nmoe.sglang.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.sglang.replicaCount }}
  {{- if .Values.sglang.strategy }}
  strategy:
    {{- toYaml .Values.sglang.strategy | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "nmoe.sglang.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.monitoring.metrics.port | quote }}
        prometheus.io/path: {{ .Values.monitoring.metrics.path | quote }}
      labels:
        {{- include "nmoe.sglang.selectorLabels" . | nindent 8 }}
        app: nmoe
        component: inference
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "nmoe.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: false
      {{- if .Values.sglang.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ .Values.sglang.terminationGracePeriodSeconds }}
      {{- end }}
      containers:
        - name: sglang
          image: "{{ .Values.sglang.image.repository }}:{{ .Values.sglang.image.tag }}"
          imagePullPolicy: {{ .Values.sglang.image.pullPolicy }}
          command:
            - python
            - -m
            - sglang.launch_server
          args:
            - --model-path
            - {{ .Values.sglang.model.name | quote }}
            - --port
            - {{ .Values.sglang.server.port | quote }}
            - --host
            - {{ .Values.sglang.server.host | quote }}
            - --tp
            - {{ .Values.sglang.moe.tensorParallelSize | quote }}
            {{- if gt (int .Values.sglang.moe.expertParallelSize) 1 }}
            - --ep
            - {{ .Values.sglang.moe.expertParallelSize | quote }}
            {{- end }}
            {{- if .Values.sglang.model.trustRemoteCode }}
            - --trust-remote-code
            {{- end }}
            - --dtype
            - {{ .Values.sglang.model.dtype | quote }}
            {{- if .Values.sglang.model.quantization }}
            - --quantization
            - {{ .Values.sglang.model.quantization | quote }}
            {{- end }}
            - --max-total-tokens
            - {{ .Values.sglang.server.maxTotalTokens | quote }}
            - --context-length
            - {{ .Values.sglang.server.contextLength | quote }}
            {{- if .Values.sglang.moe.enableTorchCompile }}
            - --enable-torch-compile
            {{- end }}
            {{- if .Values.sglang.moe.enableMixedPrecision }}
            - --enable-mixed-chunk
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.sglang.server.port }}
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.monitoring.metrics.port }}
              protocol: TCP
          env:
            {{- include "nmoe.cuda.env" . | nindent 12 }}
            {{- include "nmoe.rdep.env" . | nindent 12 }}
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.huggingface.existingSecret | default .Values.secrets.huggingface.secretName }}
                  key: {{ .Values.secrets.huggingface.key }}
            {{- if .Values.sglang.server.apiKey }}
            - name: SGLANG_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.apiKey.existingSecret | default .Values.secrets.apiKey.secretName }}
                  key: {{ .Values.secrets.apiKey.key }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 300
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          {{- if .Values.sglang.startupProbe.enabled }}
          startupProbe:
            httpGet:
              path: {{ .Values.sglang.startupProbe.httpGet.path }}
              port: {{ .Values.sglang.startupProbe.httpGet.port }}
            initialDelaySeconds: {{ .Values.sglang.startupProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.sglang.startupProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.sglang.startupProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.sglang.startupProbe.failureThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.sglang.resources | nindent 12 }}
          volumeMounts:
            - name: model-cache
              mountPath: {{ .Values.sglang.persistence.mountPath }}
            - name: shm
              mountPath: /dev/shm
            - name: config
              mountPath: /etc/nmoe
              readOnly: true
      volumes:
        - name: model-cache
          {{- if .Values.sglang.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "nmoe.sglang.fullname" . }}-models
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 64Gi
        - name: config
          configMap:
            name: {{ include "nmoe.fullname" . }}-config
      {{- with .Values.sglang.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.sglang.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.sglang.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
