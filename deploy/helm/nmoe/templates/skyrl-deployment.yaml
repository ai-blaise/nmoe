{{- if .Values.skyrl.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nmoe.skyrl.fullname" . }}
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  labels:
    {{- include "nmoe.skyrl.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.skyrl.replicaCount }}
  selector:
    matchLabels:
      {{- include "nmoe.skyrl.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.skyrl.ray.dashboardPort | quote }}
        prometheus.io/path: "/metrics"
      labels:
        {{- include "nmoe.skyrl.selectorLabels" . | nindent 8 }}
        app: nmoe
        component: training
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "nmoe.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: false
      initContainers:
        - name: wait-for-sglang
          image: busybox:1.36
          command: ['sh', '-c', 'until wget -q -O- http://{{ include "nmoe.sglang.fullname" . }}:{{ .Values.sglang.server.port }}/health; do echo waiting for sglang; sleep 5; done']
      containers:
        - name: skyrl-worker
          image: "{{ .Values.skyrl.image.repository }}:{{ .Values.skyrl.image.tag }}"
          imagePullPolicy: {{ .Values.skyrl.image.pullPolicy }}
          command:
            - python
            - -m
            - skyrl.train
          args:
            - --algorithm
            - {{ .Values.skyrl.training.algorithm | quote }}
            - --batch-size
            - {{ .Values.skyrl.training.batchSize | quote }}
            - --gradient-accumulation-steps
            - {{ .Values.skyrl.training.gradientAccumulationSteps | quote }}
            - --learning-rate
            - {{ .Values.skyrl.training.learningRate | quote }}
            - --num-epochs
            - {{ .Values.skyrl.training.numEpochs | quote }}
            - --warmup-steps
            - {{ .Values.skyrl.training.warmupSteps | quote }}
            - --max-grad-norm
            - {{ .Values.skyrl.training.maxGradNorm | quote }}
            - --weight-decay
            - {{ .Values.skyrl.training.weightDecay | quote }}
            - --kl-coef
            - {{ .Values.skyrl.rl.klCoefficient | quote }}
            - --clip-range
            - {{ .Values.skyrl.rl.clipRange | quote }}
            - --checkpoint-dir
            - {{ .Values.skyrl.persistence.mountPath | quote }}
            - --sglang-url
            - "http://{{ include "nmoe.sglang.fullname" . }}:{{ .Values.sglang.server.port }}"
          ports:
            - name: ray-head
              containerPort: {{ .Values.skyrl.ray.headServicePort }}
              protocol: TCP
            - name: dashboard
              containerPort: {{ .Values.skyrl.ray.dashboardPort }}
              protocol: TCP
          env:
            {{- include "nmoe.cuda.env" . | nindent 12 }}
            {{- include "nmoe.rdep.env" . | nindent 12 }}
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.huggingface.existingSecret | default .Values.secrets.huggingface.secretName }}
                  key: {{ .Values.secrets.huggingface.key }}
            {{- if .Values.secrets.wandb.enabled }}
            - name: WANDB_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.wandb.existingSecret | default .Values.secrets.wandb.secretName }}
                  key: WANDB_API_KEY
            - name: WANDB_ENTITY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.wandb.existingSecret | default .Values.secrets.wandb.secretName }}
                  key: WANDB_ENTITY
            - name: WANDB_PROJECT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.wandb.existingSecret | default .Values.secrets.wandb.secretName }}
                  key: WANDB_PROJECT
            {{- end }}
            - name: RAY_ADDRESS
              value: "auto"
            - name: RAY_DASHBOARD_HOST
              value: "0.0.0.0"
            # Training hyperparameters as env vars for runtime override
            - name: NMOE_BATCH_SIZE
              value: {{ .Values.skyrl.training.batchSize | quote }}
            - name: NMOE_GRAD_ACCUM
              value: {{ .Values.skyrl.training.gradientAccumulationSteps | quote }}
            - name: NMOE_LR
              value: {{ .Values.skyrl.training.learningRate | quote }}
            - name: NMOE_KL_COEF
              value: {{ .Values.skyrl.rl.klCoefficient | quote }}
          livenessProbe:
            httpGet:
              path: /
              port: dashboard
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /
              port: dashboard
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.skyrl.resources | nindent 12 }}
          volumeMounts:
            - name: checkpoints
              mountPath: {{ .Values.skyrl.persistence.mountPath }}
            - name: shm
              mountPath: /dev/shm
            - name: config
              mountPath: /etc/nmoe
              readOnly: true
      volumes:
        - name: checkpoints
          {{- if .Values.skyrl.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "nmoe.skyrl.fullname" . }}-checkpoints
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 64Gi
        - name: config
          configMap:
            name: {{ include "nmoe.fullname" . }}-config
      {{- with .Values.skyrl.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.skyrl.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.skyrl.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
