# Alertmanager configuration for nmoe
global:
  # SMTP settings for email notifications
  # smtp_smarthost: 'smtp.example.com:587'
  # smtp_from: 'alertmanager@example.com'
  # smtp_auth_username: 'alertmanager'
  # smtp_auth_password: 'password'

  # Slack webhook (uncomment to enable)
  # slack_api_url: 'https://hooks.slack.com/services/xxx/xxx/xxx'

  resolve_timeout: 5m

# Route tree
route:
  # Default receiver
  receiver: 'default-receiver'

  # Group alerts by these labels
  group_by: ['alertname', 'cluster', 'service']

  # Wait before sending initial notification
  group_wait: 30s

  # Wait before sending updated notification
  group_interval: 5m

  # Wait before resending notification
  repeat_interval: 4h

  # Child routes for specific alert handling
  routes:
    # Critical GPU alerts - immediate notification
    - match:
        severity: critical
      receiver: 'critical-receiver'
      group_wait: 10s
      repeat_interval: 1h

    # High-priority training alerts
    - match:
        component: training
        severity: warning
      receiver: 'training-receiver'
      group_wait: 1m

    # Inference server alerts
    - match:
        component: inference
      receiver: 'inference-receiver'
      group_wait: 30s

# Inhibition rules to prevent duplicate alerts
inhibit_rules:
  # If critical alert is firing, suppress warning alerts for same alertname
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'cluster', 'service']

  # If node is down, suppress all pod alerts on that node
  - source_match:
      alertname: 'NodeDown'
    target_match_re:
      alertname: 'Pod.*'
    equal: ['node']

# Receivers
receivers:
  - name: 'default-receiver'
    # Webhook receiver (for custom integrations)
    webhook_configs:
      - url: 'http://localhost:5001/alerts'
        send_resolved: true

  - name: 'critical-receiver'
    # Email for critical alerts
    # email_configs:
    #   - to: 'oncall@example.com'
    #     send_resolved: true

    # Slack for critical alerts
    # slack_configs:
    #   - channel: '#nmoe-critical'
    #     send_resolved: true
    #     title: '{{ "{{" }} .Status | toUpper {{ "}}" }}: {{ "{{" }} .CommonAnnotations.summary {{ "}}" }}'
    #     text: '{{ "{{" }} .CommonAnnotations.description {{ "}}" }}'

    webhook_configs:
      - url: 'http://localhost:5001/critical'
        send_resolved: true

  - name: 'training-receiver'
    webhook_configs:
      - url: 'http://localhost:5001/training'
        send_resolved: true

  - name: 'inference-receiver'
    webhook_configs:
      - url: 'http://localhost:5001/inference'
        send_resolved: true

# Templates for notifications
templates:
  - '/etc/alertmanager/templates/*.tmpl'
