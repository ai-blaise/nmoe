# Prometheus alerting rules for nmoe
groups:
  - name: nmoe-gpu-alerts
    rules:
      # GPU memory utilization too high
      - alert: GPUMemoryHigh
        expr: DCGM_FI_DEV_FB_USED / DCGM_FI_DEV_FB_TOTAL * 100 > 95
        for: 5m
        labels:
          severity: warning
          component: gpu
        annotations:
          summary: "GPU {{ $labels.gpu }} memory usage above 95%"
          description: "GPU {{ $labels.gpu }} on {{ $labels.instance }} has {{ $value }}% memory utilization"

      # GPU memory exhausted
      - alert: GPUMemoryExhausted
        expr: DCGM_FI_DEV_FB_FREE < 1073741824  # < 1GB free
        for: 1m
        labels:
          severity: critical
          component: gpu
        annotations:
          summary: "GPU {{ $labels.gpu }} memory exhausted"
          description: "GPU {{ $labels.gpu }} has less than 1GB free memory"

      # GPU temperature too high
      - alert: GPUTemperatureHigh
        expr: DCGM_FI_DEV_GPU_TEMP > 80
        for: 5m
        labels:
          severity: warning
          component: gpu
        annotations:
          summary: "GPU {{ $labels.gpu }} temperature above 80°C"
          description: "GPU {{ $labels.gpu }} temperature is {{ $value }}°C"

      # GPU throttling detected
      - alert: GPUThrottling
        expr: DCGM_FI_DEV_POWER_VIOLATION > 0 or DCGM_FI_DEV_THERMAL_VIOLATION > 0
        for: 1m
        labels:
          severity: warning
          component: gpu
        annotations:
          summary: "GPU {{ $labels.gpu }} is throttling"
          description: "GPU throttling detected due to power or thermal limits"

      # GPU ECC errors
      - alert: GPUECCErrors
        expr: increase(DCGM_FI_DEV_ECC_DBE_VOL_TOTAL[5m]) > 0
        labels:
          severity: critical
          component: gpu
        annotations:
          summary: "GPU {{ $labels.gpu }} ECC double-bit errors detected"
          description: "Critical ECC errors on GPU {{ $labels.gpu }}. Hardware may be failing."

  - name: nmoe-inference-alerts
    rules:
      # SGLang server down
      - alert: SGLangServerDown
        expr: up{job="sglang"} == 0
        for: 1m
        labels:
          severity: critical
          component: inference
        annotations:
          summary: "SGLang server {{ $labels.instance }} is down"
          description: "SGLang inference server has been unreachable for more than 1 minute"

      # High inference latency
      - alert: InferenceLatencyHigh
        expr: histogram_quantile(0.99, rate(sglang_request_latency_seconds_bucket[5m])) > 5
        for: 5m
        labels:
          severity: warning
          component: inference
        annotations:
          summary: "High inference latency on {{ $labels.instance }}"
          description: "P99 inference latency is {{ $value }}s, exceeding 5s threshold"

      # Request queue building up
      - alert: RequestQueueHigh
        expr: sglang_pending_requests > 100
        for: 5m
        labels:
          severity: warning
          component: inference
        annotations:
          summary: "Request queue building up on {{ $labels.instance }}"
          description: "{{ $value }} pending requests in queue"

      # Token generation rate dropping
      - alert: TokenGenerationSlow
        expr: rate(sglang_tokens_generated_total[5m]) < 100
        for: 10m
        labels:
          severity: warning
          component: inference
        annotations:
          summary: "Token generation rate low on {{ $labels.instance }}"
          description: "Token generation rate is {{ $value }} tokens/s"

      # KV cache utilization high
      - alert: KVCacheHigh
        expr: sglang_kv_cache_utilization > 0.9
        for: 5m
        labels:
          severity: warning
          component: inference
        annotations:
          summary: "KV cache utilization high on {{ $labels.instance }}"
          description: "KV cache utilization is {{ $value | humanizePercentage }}"

  - name: nmoe-training-alerts
    rules:
      # Training worker down
      - alert: SkyRLWorkerDown
        expr: up{job="skyrl-workers"} == 0
        for: 2m
        labels:
          severity: critical
          component: training
        annotations:
          summary: "SkyRL worker {{ $labels.instance }} is down"
          description: "Training worker has been unreachable for more than 2 minutes"

      # Training loss not decreasing
      - alert: TrainingLossStale
        expr: increase(skyrl_training_loss[30m]) == 0
        for: 30m
        labels:
          severity: warning
          component: training
        annotations:
          summary: "Training loss not changing on {{ $labels.instance }}"
          description: "Training loss has been static for 30 minutes"

      # Gradient overflow/underflow
      - alert: GradientAnomalies
        expr: skyrl_gradient_norm > 100 or skyrl_gradient_norm < 1e-6
        for: 5m
        labels:
          severity: warning
          component: training
        annotations:
          summary: "Gradient anomalies detected on {{ $labels.instance }}"
          description: "Gradient norm is {{ $value }}, indicating potential overflow/underflow"

      # Ray cluster unhealthy
      - alert: RayClusterUnhealthy
        expr: ray_cluster_nodes_active < ray_cluster_nodes_expected
        for: 5m
        labels:
          severity: warning
          component: training
        annotations:
          summary: "Ray cluster missing nodes"
          description: "Expected {{ $labels.expected }} nodes, only {{ $value }} active"

  - name: nmoe-moe-alerts
    rules:
      # Expert load imbalance
      - alert: ExpertLoadImbalance
        expr: stddev(nmoe_expert_load) / avg(nmoe_expert_load) > 0.5
        for: 10m
        labels:
          severity: warning
          component: moe
        annotations:
          summary: "Expert load imbalance detected"
          description: "Expert load standard deviation is {{ $value }}x the mean"

      # Token dropping too high
      - alert: TokenDroppingHigh
        expr: rate(nmoe_tokens_dropped_total[5m]) / rate(nmoe_tokens_processed_total[5m]) > 0.05
        for: 5m
        labels:
          severity: warning
          component: moe
        annotations:
          summary: "High token drop rate"
          description: "{{ $value | humanizePercentage }} of tokens being dropped"

      # RDEP dispatch latency high
      - alert: RDEPLatencyHigh
        expr: histogram_quantile(0.99, rate(nmoe_rdep_dispatch_latency_seconds_bucket[5m])) > 0.01
        for: 5m
        labels:
          severity: warning
          component: moe
        annotations:
          summary: "RDEP dispatch latency high"
          description: "P99 RDEP dispatch latency is {{ $value }}s"

  - name: nmoe-node-alerts
    rules:
      # Node memory pressure
      - alert: NodeMemoryPressure
        expr: (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes > 0.9
        for: 10m
        labels:
          severity: warning
          component: node
        annotations:
          summary: "High memory usage on {{ $labels.instance }}"
          description: "Node memory usage is {{ $value | humanizePercentage }}"

      # Node CPU pressure
      - alert: NodeCPUPressure
        expr: 100 - (avg by(instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 90
        for: 10m
        labels:
          severity: warning
          component: node
        annotations:
          summary: "High CPU usage on {{ $labels.instance }}"
          description: "CPU usage is {{ $value }}%"

      # Disk space low
      - alert: DiskSpaceLow
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) < 0.1
        for: 10m
        labels:
          severity: warning
          component: node
        annotations:
          summary: "Low disk space on {{ $labels.instance }}"
          description: "Only {{ $value | humanizePercentage }} disk space remaining"
