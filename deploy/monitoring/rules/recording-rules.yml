# Prometheus recording rules for nmoe
# These pre-compute expensive queries for faster dashboard loading

groups:
  - name: nmoe-recording-rules
    interval: 15s
    rules:
      # GPU utilization aggregates
      - record: nmoe:gpu_utilization:avg
        expr: avg(DCGM_FI_DEV_GPU_UTIL)

      - record: nmoe:gpu_utilization:max
        expr: max(DCGM_FI_DEV_GPU_UTIL)

      - record: nmoe:gpu_memory_used:sum
        expr: sum(DCGM_FI_DEV_FB_USED)

      - record: nmoe:gpu_memory_total:sum
        expr: sum(DCGM_FI_DEV_FB_TOTAL)

      - record: nmoe:gpu_memory_utilization:avg
        expr: avg(DCGM_FI_DEV_FB_USED / DCGM_FI_DEV_FB_TOTAL * 100)

      # Inference metrics aggregates
      - record: nmoe:sglang_requests:rate5m
        expr: sum(rate(sglang_requests_total[5m]))

      - record: nmoe:sglang_tokens:rate5m
        expr: sum(rate(sglang_tokens_generated_total[5m]))

      - record: nmoe:sglang_latency:p50
        expr: histogram_quantile(0.50, sum(rate(sglang_request_latency_seconds_bucket[5m])) by (le))

      - record: nmoe:sglang_latency:p95
        expr: histogram_quantile(0.95, sum(rate(sglang_request_latency_seconds_bucket[5m])) by (le))

      - record: nmoe:sglang_latency:p99
        expr: histogram_quantile(0.99, sum(rate(sglang_request_latency_seconds_bucket[5m])) by (le))

      # MoE expert load balance
      - record: nmoe:expert_load:stddev
        expr: stddev(nmoe_expert_load)

      - record: nmoe:expert_load:mean
        expr: avg(nmoe_expert_load)

      - record: nmoe:expert_load_imbalance:ratio
        expr: stddev(nmoe_expert_load) / avg(nmoe_expert_load)

      # RDEP dispatch metrics
      - record: nmoe:rdep_dispatch_latency:p99
        expr: histogram_quantile(0.99, sum(rate(nmoe_rdep_dispatch_latency_seconds_bucket[5m])) by (le))

      # Training metrics aggregates
      - record: nmoe:training_loss:rate5m
        expr: rate(skyrl_training_loss[5m])

      - record: nmoe:gradient_norm:avg
        expr: avg(skyrl_gradient_norm)

      # Node resource utilization
      - record: nmoe:node_cpu:avg
        expr: 100 - (avg(rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)

      - record: nmoe:node_memory:utilization
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100
