[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nmoe"
version = "0.1.0"
description = "B200-targeted Mixture-of-Experts training library with RDEP."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "The NMoE Authors" }]

# Core dependencies - torch packages come from pytorch-nightly index (see [tool.uv])
dependencies = [
    "numpy>=2.4.0,<3.0",
    "safetensors>=0.7.0,<1.0",
    "omegaconf>=2.3.0",
    # PyTorch B200/SM100 nightly - pinned versions
    "torch==2.11.0.dev20260202+cu128",
    "torchvision==0.25.0.dev20260202+cu128",
    "torchaudio==2.11.0.dev20260202+cu128",
    "torchao==0.16.0.dev20260202+cu128",
    "triton==3.6.0+git9844da95",
]

[project.optional-dependencies]
# Build dependencies for C extensions
build = [
    "pybind11>=2.13.0,<3.0",
    "ninja>=1.11.0",
    "cmake>=3.26",
    "scikit-build-core>=0.9.0",
]

# Dev/test dependencies
dev = [
    # Build tools
    "pybind11>=2.13.0,<3.0",
    "ninja>=1.11.0",
    "cmake>=3.26",
    "scikit-build-core>=0.9.0",

    # NVIDIA CUDA libraries
    "nvidia-cutlass-dsl>=4.3.1,<5.0",
    # cuda-python and cuda-bindings come from torch nightly (12.9.4)

    # Database
    "duckdb>=1.4.0,<2.0",

    # ML libraries
    "transformers>=4.57.0,<5.0",
    "scipy>=1.17.0,<2.0",

    # Testing
    "pytest>=9.0.0,<10.0",
    "pytest-cov>=7.0.0,<8.0",
    "packaging>=24.0",

    # API/Web (for SGLang serving tests)
    "fastapi>=0.128.0,<1.0",
    "uvicorn>=0.40.0,<1.0",
    "openai>=2.6.0,<3.0",
    "aiohttp>=3.13.0,<4.0",
    "requests>=2.32.0,<3.0",
    "pydantic>=2.12.0,<3.0",
    "pillow>=12.0.0,<13.0",

    # Dev tools
    "ipython>=9.0.0,<10.0",
]

# Minimal test dependencies (no SGLang serving)
test = [
    "pytest>=9.0.0,<10.0",
    "pytest-cov>=7.0.0,<8.0",
    "packaging>=24.0",
]

[tool.setuptools.packages.find]
include = ["nmoe*"]
namespaces = true

[tool.setuptools.package-data]
"nmoe.data" = ["*.pt", "*.json"]

# uv configuration for PyTorch nightly index
[tool.uv]
# Use unsafe-best-match to allow packages from any index
index-strategy = "unsafe-best-match"

[tool.uv.sources]
sglang = { path = "../sglang/python", editable = true }
# Force torch packages from pytorch-nightly index
torch = { index = "pytorch-nightly" }
torchvision = { index = "pytorch-nightly" }
torchaudio = { index = "pytorch-nightly" }
torchao = { index = "pytorch-nightly" }
triton = { index = "pytorch-nightly" }

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[[tool.uv.index]]
name = "pytorch-nightly"
url = "https://download.pytorch.org/whl/nightly/cu128"
explicit = true

[dependency-groups]
dev = [
    "duckdb>=1.4.4",
    "pytest-forked>=1.6.0",
    "sglang",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "-ra",
    "--strict-markers",
]
markers = [
    "gpu: marks tests as requiring GPU (deselect with '-m \"not gpu\"')",
    "multi_gpu: marks tests as requiring multiple GPUs",
    "distributed: marks tests as requiring distributed setup",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "nvshmem: marks tests as requiring NVSHMEM",
    "benchmark: marks performance/benchmark tests (run with '-m benchmark')",
    "integration: marks integration tests (run with '-m integration')",
    "e2e: marks end-to-end pipeline tests (run with '-m e2e')",
]
filterwarnings = [
    "ignore::DeprecationWarning:cutlass.*",
    "ignore::DeprecationWarning:nvidia_cutlass_dsl.*",
    "ignore::SyntaxWarning",
]

[tool.coverage.run]
source = ["nmoe"]
branch = true
omit = [
    "tests/*",
    "nmoe/csrc/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # function call in default argument (common in torch)
    "B905",   # zip without strict (Python 3.10+ feature)
    "E402",   # module level import not at top (common in torch for cuda init)
]

[tool.ruff.lint.isort]
known-first-party = ["nmoe"]
force-single-line = false
lines-after-imports = 2

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
